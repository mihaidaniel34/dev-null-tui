[package]
name = "devnull"
version = "0.1.0"
edition = "2024"
description = "A terminal client for /dev/null, the social network for developers"
repository = "https://github.com/mihaidaniel34/dev-null-tui"
readme = "README.md"
license = "MIT"

[[bin]]
name = "devnull"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
futures = "0.3"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh-key = { version = "0.6", features = ["ed25519", "std", "rand_core"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
unicode-width = "0.2"
url = "2"

[profile.release]
lto = true
strip = true
