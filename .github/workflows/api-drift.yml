name: API drift

# Fails when the /dev/null server changed the routes, responses or requests devnull depends on since
# docs/api-contract.lock, with the diff in the log. See docs/api-contract.md.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-api.sh
